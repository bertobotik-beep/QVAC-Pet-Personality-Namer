<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QVAC Pet Personality Namer</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #f0fdf4;
    font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    color: #1f2937;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }
  .wrap { width: 100%; max-width: 480px; }
  h1 { font-size: 1.5rem; margin: 0 0 6px; color: #14532d; }
  .subtitle { color: #4d7c0f; margin-bottom: 20px; font-size: 0.9rem; }
  .card {
    background: #fff;
    border: 1px solid #bbf7d0;
    border-radius: 14px;
    padding: 24px;
  }
  input[type=text] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #86efac;
    font-family: inherit;
    font-size: 1rem;
    margin-bottom: 12px;
  }
  button.action {
    padding: 10px 22px;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    background: #16a34a;
    color: #fff;
  }
  button.action:disabled { opacity: 0.5; cursor: not-allowed; }
  .status { margin-top: 12px; font-size: 0.85rem; color: #4d7c0f; min-height: 1.2em; }
  .result-list { margin-top: 16px; list-style: none; padding: 0; display: none; }
  .result-list li {
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font-size: 1.05rem;
    font-weight: 600;
    color: #14532d;
  }
  .footer-note { color: #9ca3af; font-size: 0.78rem; margin-top: 20px; text-align: center; }
  .spinner {
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid #bbf7d0;
    border-top-color: #16a34a;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <h1>QVAC Pet Personality Namer</h1>
    <p class="subtitle">Enter an animal type and a personality trait, get name ideas. 100% on-device.</p>

    <div class="card">
      <input type="text" id="animalInput" placeholder="Animal type, e.g. dog, cat, parrot" />
      <input type="text" id="traitInput" placeholder="Personality trait, e.g. lazy, mischievous (optional)" />
      <button class="action" id="generateBtn">Get Names</button>
      <div class="status" id="status"></div>
      <ul class="result-list" id="resultList"></ul>
    </div>

    <p class="footer-note">Everything runs locally on your machine. No text ever leaves this device.</p>
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const animalInput = document.getElementById('animalInput');
    const traitInput = document.getElementById('traitInput');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const resultList = document.getElementById('resultList');

    async function generate() {
      const animal = animalInput.value.trim();
      if (!animal) return;
      generateBtn.disabled = true;
      resultList.style.display = 'none';
      resultList.innerHTML = '';
      status.innerHTML = '<span class="spinner"></span>Thinking of names...';

      try {
        const res = await fetch('/api/petname', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ animal, trait: traitInput.value.trim() }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        status.textContent = '';
        resultList.innerHTML = data.names.map((n) => `<li>${escapeHtml(n)}</li>`).join('');
        resultList.style.display = 'block';
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        generateBtn.disabled = false;
      }
    }

    generateBtn.addEventListener('click', generate);
  </script>
</body>
</html>
